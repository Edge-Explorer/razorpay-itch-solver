events {
    worker_connections 1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    # Define our backend upstream server (points to the 'web' service in compose)
    upstream backend_servers {
        server web:8000; # 'web' is the hostname of the backend service in Docker Compose
    }

    server {
        listen 80; # Listen on Port 80 for incoming HTTP requests
        server_name localhost; # Servers can be accessed via localhost

        # Standard HTTP requests
        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket connection Upgrades (requests targeting /ws/)
        location /ws/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            # Connection and Upgrade headers are required for WS handshakes
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent Nginx from closing the WebSocket connection prematurely
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}