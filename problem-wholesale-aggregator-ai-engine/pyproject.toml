[project]
name = "problem-wholesale-aggregator-ai-engine"
version = "0.1.0"
description = "AI-powered demand aggregator for small restaurants to access wholesale pricing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.110.0",
    "uvicorn>=0.27.1",
    "celery[redis]>=5.3.6",
    "sqlalchemy[asyncio]>=2.0.27",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.2.1",
    "google-genai>=0.3.0",
    "httpx>=0.27.0",
    "redis>=5.0.1",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "cloudinary>=1.44.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]
